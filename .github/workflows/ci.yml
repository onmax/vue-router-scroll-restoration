name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      ref:
        description: Git ref to verify
        required: false
        type: string

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.sha }}
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm lint
      # Generates .nuxt types for the module and the playground
      - run: pnpm dev:prepare
      - run: pnpm typecheck
      - run: pnpm check:doctor
      # Builds dist and checks the packed package with publint
      - run: pnpm validate
      - run: pnpm build:playgrounds
      - run: pnpm exec playwright install --with-deps chromium webkit
      - run: pnpm test:e2e
