name: Preview Package

on:
  pull_request:
  push:
    branches:
      - main
      # Release PRs created with GITHUB_TOKEN may not trigger pull_request workflows.
      - "release/v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  publish:
    # Do not give fork pull requests a write-capable token while executing their package scripts.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm build
      - run: pnpm dlx pkg-pr-new publish --pnpm --packageManager=pnpm
        env:
          # The build above already ran prepack.
          pnpm_config_ignore_scripts: "true"
