trustPolicy: no-downgrade
trustPolicyExclude:
  # newer semver majors carry provenance, 6.x never did; @babel/core (via nuxt) depends on it
  - semver@6.3.1
  - vite-doctor@0.1.1

minimumReleaseAgeExclude:
  - vite-doctor@0.1.1

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  unrs-resolver: false
  vue-demi: false

catalogs:
  build:
    '@nuxt/module-builder': ^1.0.3
    '@types/node': ^24.19.2
    publint: ^0.3.25
    typescript: ^6.0.3
    vue-tsc: ^3.3.14
  lint:
    '@nuxt/eslint-config': ^1.17.0
    eslint: ^10.14.0
    vite-doctor: ^0.1.1
  nuxt:
    nuxt: ^4.6.3
    vue: ^3.5.44
    vue-router: ^5.4.0
  prod:
    '@nuxt/kit': ^4.6.3
  test:
    '@playwright/test': ^1.64.1
    '@vitejs/plugin-vue': ^6.0.10
    vite: ^8.3.5
